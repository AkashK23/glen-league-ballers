[project]
name = "league-core"
version = "0.1.0"
description = "Platform-agnostic fantasy football league history, records and rivalries"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
espn = ["espn_api"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
