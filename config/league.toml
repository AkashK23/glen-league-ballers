# League configuration. Secrets (ESPN cookies) go in .env, never here.

[league]
provider = "espn"          # swap to "sleeper", "yahoo", ... once a provider exists
league_id = 307073         # from your ESPN league URL: ...?leagueId=XXXXXX
first_year = 2014

[site]
name = "Glen League Ballers"
tagline = "May God help us all"
short_name = "GLB"
wordmark = "Glen League Archives"
hero_title = "Welcome to the GLB Archives"

# Canonical owners. Stats are keyed by person, not team name. `ids` lists every
